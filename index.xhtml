<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Banana Tracker</title>
  <link rel="icon" type="image/png" sizes="16x16" href="banana_icon_16.png" />
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#2b2b2b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Banana" />
  <link rel="stylesheet" href="styles.css?v=20261124b" />
</head>
<body>
  <div id="app-loading-overlay" class="app-loading-overlay">
    <div class="app-loading-spinner" aria-hidden="true"></div>
    <p>Loading...</p>
    <p id="app-loading-status" class="app-loading-status"></p>
  </div>
  <div class="app-shell app-loading">
    <header class="top-nav" aria-label="Main navigation">
      <button class="tab-button active" data-tab="cal" type="button">Track</button>
      <button class="tab-button" data-tab="weight" type="button">Progress</button>
      <button class="tab-button" data-tab="data" type="button">Data</button>
      <span id="app-version-label" class="app-version-label"></span>
    </header>

    <main>
      <section id="tab-cal" class="tab-section active">
        <p class="summary">Daily total: <strong id="daily-total">0</strong> kcal. Remaining: <strong id="calories-left">0</strong> kcal.</p>

        <button id="show-cal-add-btn" type="button" class="new-entry-button">New entry</button>

        <ul id="cal-entry-list" class="list"></ul>
      </section>

      <section id="tab-weight" class="tab-section">
        <div class="card">
          <form id="weight-today-form" class="progress-entry-row">
            <span id="weight-date-display" class="progress-date-display">2026-11-21</span>
            <input id="weight-today-date" type="date" class="hidden-date-input" />
            <button id="weight-date-picker-btn" type="button" class="icon-edit-button date-picker-button" aria-label="Select date">📅</button>
            <input id="weight-today-input" type="text" inputmode="decimal" required="required" placeholder="weight" />
            <button type="submit" class="inline-save-button">Save</button>
          </form>
        </div>

        <div class="card">
          <h2>Trend</h2>
          <canvas id="weight-chart" width="900" height="360" aria-label="Weight chart"></canvas>
        </div>

        <div class="card">
          <h2>History</h2>
          <ul id="weight-history-list" class="list"></ul>
        </div>
      </section>

      <section id="tab-data" class="tab-section">
        <div class="card">
          <div class="card-header-row">
            <h2>Maintenance</h2>
            <button id="maintenance-toggle-btn" type="button" class="small-inline-button" aria-expanded="true" aria-controls="maintenance-body">Hide</button>
          </div>
          <div id="maintenance-body">
            <button id="install-app-btn" type="button" class="hidden">Install webapp on device</button>
            <p id="install-app-status" class="field-hint"></p>
            <button id="deep-refresh-btn" type="button" class="danger">Deep refresh app</button>
            <p id="deep-refresh-status" class="field-hint"></p>
            <button id="clear-all-history-btn" type="button" class="danger">Clear all history</button>
            <p id="clear-all-history-status" class="field-hint"></p>
            <ul id="changelog-list" class="changelog-list"></ul>
          </div>
        </div>

        <div class="card">
          <h2>Targets</h2>
          <form id="targets-form">
            <label for="daily-calorie-target">Daily calory target</label>
            <input id="daily-calorie-target" type="number" step="1" inputmode="numeric" required="required" />

            <label for="weight-target">Weight target</label>
            <input id="weight-target" type="number" step="1" inputmode="numeric" required="required" />
          </form>
        </div>

        <div class="card">
          <h2>Create Template</h2>
          <form id="template-form">
            <label for="template-name">Name</label>
            <input id="template-name" type="text" maxlength="80" autocomplete="off" required="required" />

            <label for="template-cal">Calories per unit</label>
            <div class="type-row">
              <input id="template-cal" type="text" inputmode="decimal" pattern="-?[0-9]*\.?[0-9]*" required="required" />
              <button id="template-cal-sign-btn" type="button" class="qty-adjust-button" aria-label="Toggle positive/negative">±</button>
            </div>

            <button type="submit">Create template</button>
          </form>
        </div>

        <div class="card">
          <h2>Templates</h2>
          <input id="template-search" type="text" placeholder="Search templates" autocomplete="off" />
          <ul id="template-list" class="list"></ul>
        </div>
      </section>
    </main>
  </div>

  <template id="simple-list-item-template">
    <li class="list-item">
      <div class="item-main"></div>
      <div class="item-meta"></div>
      <div class="item-actions"></div>
    </li>
  </template>

  <div id="cal-entry-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-label="Calorie entry form">
    <div class="modal-backdrop" id="cal-entry-modal-backdrop"></div>
    <div class="modal-panel">
      <form id="cal-entry-form">
        <input id="cal-entry-id" type="hidden" />

        <div class="type-row autocomplete-wrap">
          <input id="cal-template-text" type="text" maxlength="80" autocomplete="off" required="required" placeholder="Type" />
          <button id="cal-template-clear-btn" type="button" class="qty-adjust-button" aria-label="Clear name" title="Clear name">&#10005;</button>
          <div id="cal-template-dropdown" class="autocomplete-dropdown hidden"></div>
        </div>

        <div class="type-row">
          <input id="cal-item-cal" type="text" inputmode="decimal" pattern="-?[0-9]*\.?[0-9]*" placeholder="Calories per item" />
          <button id="cal-item-cal-sign-btn" type="button" class="qty-adjust-button" aria-label="Toggle positive/negative">±</button>
        </div>

        <div class="quantity-row quantity-total-row">
          <span class="quantity-label">Quantity</span>
          <input id="cal-quantity" type="text" inputmode="decimal" required="required" />
          <button id="qty-plus-btn" type="button" class="qty-adjust-button" aria-label="Increase quantity">+</button>
          <button id="qty-minus-btn" type="button" class="qty-adjust-button" aria-label="Decrease quantity">-</button>
          <button id="qty-fraction-btn" type="button" class="qty-adjust-button" aria-label="Convert to 1/x fraction" title="Convert to 1/x">1/x</button>
        </div>

        <p id="cal-total-calories-line" class="total-calories-line">Total calories: <span id="cal-total-calories">0</span> kcal</p>

        <div class="quantity-row date-time-row">
          <input id="cal-entry-date" type="date" required="required" />
          <input id="cal-entry-time" type="time" step="60" lang="en-GB" required="required" />
        </div>

        <div class="color-picker-row" id="cal-color-picker-row" role="group" aria-label="Item color"></div>

        <div class="row-actions three-columns" id="cal-entry-primary-actions">
          <button id="cal-entry-submit-btn" type="submit">Add</button>
          <button id="cal-entry-cancel-btn" type="button">Cancel</button>
          <button id="cal-entry-delete-btn" type="button" class="icon-delete-button" aria-label="Delete entry" title="Delete entry">Delete</button>
        </div>
      </form>
    </div>
  </div>

  <div id="template-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-label="Template edit form">
    <div class="modal-backdrop" id="template-modal-backdrop"></div>
    <div class="modal-panel">
      <form id="template-edit-form">
        <input id="template-edit-id" type="hidden" />

        <div class="type-row one-column">
          <input id="template-edit-name" type="text" maxlength="80" autocomplete="off" required="required" placeholder="Name" />
        </div>

        <div class="quantity-row five-columns">
          <span class="quantity-label">Quantity</span>
          <input id="template-edit-cal" type="text" inputmode="decimal" pattern="-?[0-9]*\.?[0-9]*" required="required" />
          <button id="template-cal-plus-btn" type="button" class="qty-adjust-button" aria-label="Increase quantity">+</button>
          <button id="template-cal-minus-btn" type="button" class="qty-adjust-button" aria-label="Decrease quantity">-</button>
          <button id="template-edit-cal-sign-btn" type="button" class="qty-adjust-button" aria-label="Toggle positive/negative">±</button>
        </div>

        <div class="color-picker-row" id="template-edit-color-picker-row" role="group" aria-label="Item color"></div>

        <div class="row-actions three-columns">
          <button id="template-edit-save-btn" type="submit">Save</button>
          <button id="template-edit-cancel-btn" type="button">Cancel</button>
          <button id="template-edit-delete-btn" type="button" class="icon-delete-button" aria-label="Delete template" title="Delete template">Delete</button>
        </div>
      </form>
    </div>
  </div>

  <div id="progress-edit-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-label="Progress data point form">
    <div class="modal-backdrop" id="progress-edit-modal-backdrop"></div>
    <div class="modal-panel">
      <form id="progress-edit-form">
        <input id="progress-edit-original-date" type="hidden" />

        <div class="progress-entry-row">
          <span id="progress-edit-date-display" class="progress-date-display">2026-11-21</span>
          <input id="progress-edit-date" type="date" class="hidden-date-input" />
          <button id="progress-edit-date-picker-btn" type="button" class="icon-edit-button date-picker-button" aria-label="Select date">📅</button>
          <span></span>
          <span></span>
        </div>

        <div class="quantity-row">
          <span class="quantity-label">Weight</span>
          <input id="progress-edit-weight" type="number" step="0.1" inputmode="decimal" required="required" placeholder="weight" />
          <button id="progress-edit-plus-btn" type="button" class="qty-adjust-button" aria-label="Increase weight">+</button>
          <button id="progress-edit-minus-btn" type="button" class="qty-adjust-button" aria-label="Decrease weight">-</button>
        </div>

        <div class="row-actions three-columns">
          <button id="progress-edit-save-btn" type="submit">Save</button>
          <button id="progress-edit-cancel-btn" type="button">Cancel</button>
          <button id="progress-edit-delete-btn" type="button" class="icon-delete-button" aria-label="Delete progress entry" title="Delete progress entry">Delete</button>
        </div>
      </form>
    </div>
  </div>

  <script src="food_seed_data.js?v=20261124b" type="application/javascript"></script>
  <script src="app.js?v=20261124f" type="application/javascript"></script>
  <script type="application/javascript">
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js").catch(function (err) {
          console.warn("Service worker registration failed:", err);
        });
      });
    }
  </script>
</body>
</html>
